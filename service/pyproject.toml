[project]
name = "hmt-durable-governance"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["psycopg[binary,pool]>=3.2,<4", "redis>=6,<9", "cryptography>=46", "httpx>=0.28,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "coverage>=7,<8", "pandas>=2.2,<4", "pyyaml>=6,<7"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
[tool.hatch.build.targets.wheel]
packages = ["src/hmt_governance"]
